name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install quality tools
        run: python -m pip install "pytest>=8,<9" "ruff>=0.6"

      - name: Install project
        run: python -m pip install --no-deps --editable .

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest
