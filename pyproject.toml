[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-control-robot-arm"
version = "0.1.0"
description = "Real-time hand-gesture control for a four-servo robot arm"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10,<0.11",
    "opencv-python>=4.9,<5",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6",
]

[project.scripts]
gesture-robot-arm = "gesture_robot_arm.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
